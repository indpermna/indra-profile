<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Indra Permana — cybersecurity, photography, billiard, and current vibe." />
  <meta name="theme-color" content="#0b0f19" />
  <title>Indra Permana | Cybersecurity & Personal Links</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="dark-theme">

  <div class="cyber-background" aria-hidden="true">
    <canvas id="matrix-canvas"></canvas>
  </div>

  <main class="container">

    <div class="terminal-bar">

      <div
        class="terminal-dots"
        onclick="toggleSecretWindow()"
        title="Click to clear screen"
        role="button"
        tabindex="0"
        onkeydown="if(event.key==='Enter')toggleSecretWindow()"
      >
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <div class="header-controls">

        <button
          class="theme-toggle-btn"
          onclick="toggleTheme()"
          title="Toggle dark/light mode"
          aria-label="Toggle dark/light mode"
          id="theme-btn"
        >
          <i data-lucide="sun"></i>
        </button>

        <div class="lang-switcher" aria-label="Language selector">
          <button class="lang-btn" data-lang="en" onclick="changeLanguage('en')">EN</button>
          <button class="lang-btn" data-lang="id" onclick="changeLanguage('id')">ID</button>
          <button class="lang-btn" data-lang="jw" onclick="changeLanguage('jw')">JV</button>
        </div>

        <div id="google_translate_element"></div>

      </div>
    </div>

    <header class="profile-header">

      <div class="avatar-container">
        <div class="avatar-radar-ring"></div>

        <img
          src="avatar.jpg"
          alt="Indra Permana"
          class="avatar"
        />

        <span
          class="status-indicator"
          title="System online"
        ></span>
      </div>

      <h1 class="profile-name">
        Indra Permana
      </h1>

      <p class="profile-bio">
        IT Security &amp; Network Engineer
        <span class="divider">•</span>
        Cyber Security
      </p>

      <div class="collaboration-badge">
        <span class="pulse-dot"></span>
        Open for Tech Collaboration
      </div>

    </header>

    <section class="links-section">

      <h2 class="section-title">
        Networks
