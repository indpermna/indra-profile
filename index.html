<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Indra Permana</title>

  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="dark-theme">

  <div class="cyber-background">
    <canvas id="matrix-canvas"></canvas>
  </div>

  <main class="container">

    <div class="terminal-bar">

      <div
        class="terminal-dots"
        onclick="toggleSecretWindow()"
        title="Click to clear screen"
      >
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <div class="header-controls">

        <button
          class="theme-toggle-btn"
          onclick="toggleTheme()"
          title="Toggle Dark/Light Mode"
          id="theme-btn"
        >
          <svg
            id="theme-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            ></path>
          </svg>
        </button>

        <div class="lang-switcher">

          <button
            class="lang-btn"
            data-lang="en"
            onclick="changeLanguage('en')"
          >
            EN
          </button>

          <button
            class="lang-btn"
            data-lang="id"
            onclick="changeLanguage('id')"
          >
            ID
          </button>

          <button
            class="lang-btn"
            data-lang="jw"
            onclick="changeLanguage('jw')"
          >
            JV
          </button>

        </div>

        <div id="google_translate_element"></div>

      </div>
    </div>

    <header class="profile-header">

      <div class="avatar-container">

        <div class="avatar-radar-ring"></div>

        <img
          src="avatar.jpg"
          alt="Indra Permana"
          class="avatar"
        />

        <span
          class="status-indicator"
          title="System Online"
        ></span>

      </div>

      <h1 class="profile-name">
        Indra Permana
      </h1>

      <p class="profile-bio">
        IT Security &amp; Network Engineer
        <span class="divider">•</span>
        Cyber Security
      </p>

      <div class="collaboration-badge">
        <span class="pulse-dot"></span>
        Open for Tech Collaboration
      </div>

    </header>

    <section class="links-section">

      <h2 class="section-title">
        NETWORKS &amp; SOCIALS
      </h2>

      <div class="grid-container">

        <!--
